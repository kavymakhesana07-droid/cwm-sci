[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwm-sci"
version = "0.1.0"
description = "Causal World Model for Scientific Discovery - A foundation model learning causal laws from scientific data with formal do-calculus proofs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kavy Makhesana", email = "kavymakhesana07@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "networkx>=3.2",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "networkx>=3.2",
    "pydot>=1.4.2",
    "graphviz>=0.20.0",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "bandit>=1.7.8",
    "pre-commit>=3.7.0",
]
ml = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "lightning>=2.3.0",
    "dowhy>=0.9",
    "econml>=0.15",
    "causalgraphicalmodels>=0.0.4",
]
dev-ml = [
    "torch>=2.4.0",
    "lightning>=2.3.0",
    "dowhy>=0.9",
    "econml>=0.15",
    "causalgraphicalmodels>=0.0.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cwm_sci*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "T20", "ARG", "PTH", "ERA", "TRY", "S"]
ignore = [
    "S101",    # assert - used intentionally in tests
    "S603",    # subprocess - required for operational tooling
    "S607",    # start process with partial path - containerised entrypoints
    "E501",    # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "PLC0415", "PLR2004"]
"scripts/*" = ["T201", "S105", "S106"]

[tool.ruff.lint.pylint]
max-args = 12
max-returns = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_optional = false
allow_redefinition = false
namespace_packages = true

[tool.mypy.overrides]
module = [
    "aiokafka.*",
    "confluent_kafka.*",
    "pyshark.*",
    "scapy.*",
    "dpkt.*",
    "structlog.*",
    "numpy.*",
    "pandas.*",
    "sklearn.*",
    "torch.*",
    "xgboost.*",
    "dowhy.*",
    "econml.*",
    "causalgraphicalmodels.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["cwm_sci.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["cwm_sci"]
omit = ["tests/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"